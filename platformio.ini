; Four firmwares in one project (ecg, imu, ppg = one sensor each; all = the three together). Pick one with the VS Code status bar
; ("Switch PlatformIO Project Environment") or with:  pio run -e imu -t upload
[platformio]
default_envs = ecg

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 230400
upload_speed = 921600

[env:ecg]
build_src_filter = -<*> +<ecg/>

[env:imu]
build_src_filter = -<*> +<imu/>

[env:ppg]
build_src_filter = -<*> +<ppg/>

[env:all]
build_src_filter = -<*> +<all/>
monitor_speed = 460800